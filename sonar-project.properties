# Project identification
sonar.projectKey=trackify-agile-backend
sonar.projectName=Trackify Agile Backend
sonar.projectVersion=0.0.1

# Source
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=node_modules/**,dist/**,generated/**,coverage/**

# Language
sonar.language=ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Performance (limit threads to reduce memory on self-hosted runner)
sonar.threads=2

# Encoding
sonar.sourceEncoding=UTF-8
