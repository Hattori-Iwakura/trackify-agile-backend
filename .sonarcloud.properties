sonar.projectKey=Hattori-Iwakura_trackify-agile-backend
sonar.projectName=Trackify Agile Backend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/generated/**,**/*.d.ts

sonar.typescript.lcov.reportPaths=coverage/lcov.info
