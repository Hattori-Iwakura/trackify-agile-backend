name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Install SonarScanner
        shell: powershell
        run: |
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          dotnet tool install --global dotnet-sonarscanner 2>$null
          if (!(Get-Command sonar-scanner -ErrorAction SilentlyContinue)) {
            $version = "7.0.2.4839"
            $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$version-windows-x64.zip"
            Invoke-WebRequest -Uri $url -OutFile sonar-scanner.zip
            Expand-Archive -Path sonar-scanner.zip -DestinationPath $env:RUNNER_TEMP -Force
            echo "$env:RUNNER_TEMP\sonar-scanner-$version-windows-x64\bin" >> $env:GITHUB_PATH
          }

      - name: SonarQube Scan
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner -D"sonar.token=$env:SONAR_TOKEN" -D"sonar.host.url=$env:SONAR_HOST_URL"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trackify-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trackify-backend:${{ github.sha }}
